name: Release Python SDK

on:
  push:
    tags:
      - 'python-sdk-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only (do not publish)
        required: false
        default: 'true'

# Tag convention:
#   python-sdk-v0.2.0 → publishes packages/python-sdk as `operari` on PyPI.
# The tag's version must match [project].version in pyproject.toml.
#
# Publishing uses PyPI trusted publishing (OIDC): add this repository and
# workflow as a trusted publisher on the PyPI project, with environment
# `pypi-publish`. No API token is stored in the repo.

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/python-sdk-v')
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#python-sdk-v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $tag does not match pyproject version $version" >&2
            exit 1
          fi
      - run: pip install -e '.[dev]' build
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: packages/python-sdk/dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/python-sdk-v') || github.event.inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
