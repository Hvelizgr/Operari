[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operari"
version = "0.1.0"
description = "Official Python SDK for the Operari runbook automation API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Operari" }]
keywords = ["operari", "runbook", "automation", "sre", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]
dependencies = ["httpx>=0.25.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Hvelizgr/Operari"
Documentation = "https://github.com/Hvelizgr/Operari/tree/main/packages/python-sdk"
Repository = "https://github.com/Hvelizgr/Operari"

[tool.hatch.build.targets.wheel]
packages = ["src/operari"]
