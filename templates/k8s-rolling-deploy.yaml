# Operari Template: Kubernetes rolling deploy with health checks
#
# Variables expected:
#   - namespace      (string) k8s namespace
#   - deployment     (string) deployment name
#   - image          (string) new image tag, e.g. "registry/app:v2.1.4"
#   - slack_webhook  (secret) Notifications
#
# Trigger: webhook from CI when main is merged, or manual
version: 1
name: K8s Rolling Deploy
slug: k8s-rolling-deploy
description: Update image tag, watch rollout, run smoke tests, rollback on failure.
category: deploy
steps:
  - id: pre_check
    type: shell
    config:
      command: kubectl get deployment {{vars.deployment}} -n {{vars.namespace}} -o wide
    name: Pre-deploy health check
    next: set_image
  - id: set_image
    type: shell
    config:
      command: |
        kubectl set image deployment/{{vars.deployment}} \
          {{vars.deployment}}={{vars.image}} \
          -n {{vars.namespace}} \
          --record
    name: Update image
    next: watch_rollout
  - id: watch_rollout
    type: shell
    config:
      command: |
        kubectl rollout status deployment/{{vars.deployment}} \
          -n {{vars.namespace}} \
          --timeout=300s
      timeout: 360000
    name: Watch rollout status
    next: smoke_test
  - id: smoke_test
    type: shell
    config:
      command: >
        READY=$(kubectl get deployment/{{vars.deployment}} -n {{vars.namespace}} -o
        jsonpath='{.status.readyReplicas}')

        DESIRED=$(kubectl get deployment/{{vars.deployment}} -n {{vars.namespace}} -o
        jsonpath='{.status.replicas}')

        echo "Ready: $READY / Desired: $DESIRED"

        if [ "$READY" != "$DESIRED" ]; then
          echo "Replicas mismatch!"
          exit 1
        fi
    name: Smoke test pods
    next: notify_success
  - id: notify_success
    type: notify
    config:
      channel: slack
      webhookUrl: '{{vars.slack_webhook}}'
      title: K8s deploy successful
      message: '{{vars.deployment}} is now running {{vars.image}} in {{vars.namespace}}'
    name: Notify Slack
