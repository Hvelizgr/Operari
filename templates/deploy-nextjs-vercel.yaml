# Operari Template: Deploy Next.js to Vercel
# Use case: production deploys with tests, build, smoke check, and Slack notification.
#
# Variables expected:
#   - vercel_token       (secret) Your VERCEL_TOKEN
#   - slack_webhook_url  (secret) Slack incoming webhook URL
#   - production_url     (string) e.g. https://myapp.com
#
# Trigger: manual, schedule, or via webhook from GitHub Actions
version: 1
name: Deploy Next.js to Vercel
slug: deploy-nextjs-vercel
description: Production deploy with tests, build, approval gate, and Slack notification.
category: deploy
steps:
  - id: pull
    type: shell
    config:
      command: git pull origin main
      timeout: 30000
    name: Pull latest main
    next: install
  - id: install
    type: shell
    config:
      command: npm ci
      timeout: 180000
    name: Install dependencies
    next: test
  - id: test
    type: shell
    config:
      command: npm test -- --silent
      timeout: 300000
    name: Run tests
    next: build
  - id: build
    type: shell
    config:
      command: npm run build
      timeout: 600000
    name: Build
    next: approve
  - id: approve
    type: approval
    config:
      message: Tests + build passed. Ready to deploy to production?
    name: Approve production deploy
    next: deploy
  - id: deploy
    type: shell
    config:
      command: npx vercel --prod --token {{vars.vercel_token}} --yes
      timeout: 600000
    name: Deploy to Vercel (production)
    next: smoke
  - id: smoke
    type: shell
    config:
      command: |
        for i in 1 2 3; do
          if curl -fsSL {{vars.production_url}} > /dev/null; then
            echo "Health check OK"
            exit 0
          fi
          sleep 5
        done
        echo "Health check failed after 3 retries"
        exit 1
    name: Smoke test
    next: notify
  - id: notify
    type: notify
    config:
      channel: slack
      webhookUrl: '{{vars.slack_webhook_url}}'
      title: Deploy successful
      message: Deployed to {{vars.production_url}}
    name: Notify Slack
