# Operari Template: Prisma database migration with backup and rollback safety
#
# Variables expected:
#   - database_url    (secret) PostgreSQL connection string
#   - backup_dir      (string) Path where backups are stored
#   - slack_webhook   (secret) For notifications
#
# Trigger: manual (recommended) or webhook from CI before deploy
version: 1
name: Prisma DB Migration
slug: db-migration-prisma
description: Backup database, run pending migrations, verify, with manual approval and rollback.
category: migration
steps:
  - id: backup
    type: shell
    config:
      command: |
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        BACKUP_FILE="{{vars.backup_dir}}/backup_${TIMESTAMP}.sql"
        pg_dump "{{vars.database_url}}" > "$BACKUP_FILE"
        echo "Backup created: $BACKUP_FILE"
        ls -lh "$BACKUP_FILE"
    name: Backup database
    next: check_migrations
  - id: check_migrations
    type: shell
    config:
      command: npx prisma migrate status
    name: Show pending migrations
    next: approve
  - id: approve
    type: approval
    config:
      message: Review pending migrations above. Apply to production?
    name: Approve migration
    next: migrate
  - id: migrate
    type: shell
    config:
      command: npx prisma migrate deploy
      timeout: 300000
    name: Apply migrations
    next: verify
  - id: verify
    type: shell
    config:
      command: npx prisma db pull --print
    name: Verify schema
    next: notify_success
  - id: notify_success
    type: notify
    config:
      channel: slack
      webhookUrl: '{{vars.slack_webhook}}'
      title: DB Migration successful
      message: Migrations applied. Backup saved.
    name: Notify success
