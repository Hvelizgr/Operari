# NanoRun Template: Rotate AWS IAM access keys
# Use case: rotate secret every 90 days, update in Vercel + GitHub Actions, verify
#
# Variables expected:
#   - iam_user        (string) IAM username whose keys will be rotated
#   - vercel_project  (string) Vercel project name
#   - github_repo     (string) e.g. "my-org/my-repo"
#   - slack_webhook   (secret) Notification destination
#
# Trigger: schedule (every 85 days) or manual
name: Rotate AWS IAM Keys
slug: rotate-aws-secrets
description: Create new IAM access key, propagate to Vercel/GitHub, verify, then revoke old.
category: security

steps:
    - id: list_keys
      type: shell
      title: List current keys
      config:
          command: aws iam list-access-keys --user-name {{vars.iam_user}}

    - id: create_new
      type: shell
      title: Create new access key
      config:
          command: aws iam create-access-key --user-name {{vars.iam_user}} --output json

    - id: approve_propagate
      type: approval
      title: Approve key propagation
      config:
          message: "New key created. Update in Vercel + GitHub now?"

    - id: update_vercel
      type: shell
      title: Update Vercel env vars
      config:
          command: |
              echo "Update AWS_ACCESS_KEY_ID in Vercel project {{vars.vercel_project}}"
              echo "(automation requires Vercel CLI auth)"

    - id: update_github
      type: shell
      title: Update GitHub Actions secret
      config:
          command: |
              echo "Update AWS_SECRET_ACCESS_KEY in GitHub repo {{vars.github_repo}}"
              gh secret set AWS_ACCESS_KEY_ID --repo {{vars.github_repo}} --body "${NEW_KEY_ID}" || true

    - id: wait_propagation
      type: wait
      title: Wait for propagation
      config:
          durationMs: 30000

    - id: verify
      type: shell
      title: Verify new key works
      config:
          command: aws sts get-caller-identity

    - id: approve_revoke
      type: approval
      title: Approve old key revocation
      config:
          message: "New key verified working. Revoke the OLD key now? This cannot be undone."

    - id: revoke_old
      type: shell
      title: Deactivate old key
      config:
          command: |
              echo "Old key would be deactivated here"
              echo "aws iam update-access-key --user-name {{vars.iam_user}} --access-key-id <OLD> --status Inactive"

    - id: notify
      type: notify
      title: Notify team
      config:
          channel: slack
          webhookUrl: "{{vars.slack_webhook}}"
          title: "AWS keys rotated"
          message: "User {{vars.iam_user}} now has new access keys. Old keys deactivated."

connections:
    - { source: list_keys, target: create_new }
    - { source: create_new, target: approve_propagate }
    - { source: approve_propagate, target: update_vercel }
    - { source: update_vercel, target: update_github }
    - { source: update_github, target: wait_propagation }
    - { source: wait_propagation, target: verify }
    - { source: verify, target: approve_revoke }
    - { source: approve_revoke, target: revoke_old }
    - { source: revoke_old, target: notify }
