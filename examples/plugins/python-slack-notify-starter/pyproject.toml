[project]
name = "operari-py-slack-notify-starter"
version = "0.1.0"
description = "Production-shaped Python plugin starter for Operari — slack notify done end-to-end (pydantic, requests, pytest)."
requires-python = ">=3.10"
dependencies = [
  "operari>=0.1.0",
  "pydantic>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "responses>=0.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
