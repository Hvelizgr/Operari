# Fly.io app spec for the Operari frontend.
#
#   fly apps create operari-frontend --org personal
#   fly deploy --config deploy/fly/frontend.fly.toml --dockerfile frontend/Dockerfile

app = "operari-frontend"
primary_region = "iad"

[build]
  dockerfile = "frontend/Dockerfile"
  # API_URL is baked at build-time into next.config.ts rewrites.
  # Point it at the backend app — flycast is Fly's internal DNS.
  [build.args]
    API_URL = "http://operari-backend.flycast:4000"

[env]
  NODE_ENV = "production"
  # Browser-side URL. Replace with your real domain once DNS is wired.
  NEXT_PUBLIC_API_URL = "https://operari-backend.fly.dev"
  NEXT_PUBLIC_SITE_URL = "https://operari-frontend.fly.dev"
  API_URL = "http://operari-backend.flycast:4000"
  NEXT_PUBLIC_OPERARI_ANONYMOUS_MODE = "false"
  NEXT_PUBLIC_OAUTH_GOOGLE = "false"
  NEXT_PUBLIC_OAUTH_GITHUB = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
