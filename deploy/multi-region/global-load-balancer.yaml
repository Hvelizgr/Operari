apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nanoflow-global-lb
  annotations:
    kubernetes.io/ingress.class: gce-multi-cluster
    networking.gke.io/multicluster-ingress: "true"
    external-dns.alpha.kubernetes.io/hostname: app.nanoflow.io
spec:
  rules:
  - host: app.nanoflow.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nanoflow-frontend
            port:
              number: 80
---
apiVersion: networking.gke.io/v1
kind: MultiClusterService
metadata:
  name: nanoflow-frontend
spec:
  template:
    spec:
      selector:
        app: nanoflow-frontend
      ports:
      - name: http
        protocol: TCP
        port: 80
        targetPort: 3000
